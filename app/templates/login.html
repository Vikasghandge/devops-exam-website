<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps Exam Portal — Login</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0e1a;--surface:#111827;--border:#1e2d40;
    --accent:#00d4aa;--text:#e2e8f0;--muted:#64748b;
    --error:#f87171;--mono:'JetBrains Mono',monospace;--sans:'DM Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);font-family:var(--sans);min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;}
  body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;
    background:radial-gradient(ellipse at 30% 20%,rgba(0,212,170,0.06) 0%,transparent 50%),
    radial-gradient(ellipse at 70% 80%,rgba(59,130,246,0.06) 0%,transparent 50%);
    pointer-events:none;}
  .grid-bg{position:fixed;inset:0;
    background-image:linear-gradient(rgba(0,212,170,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,212,170,0.03) 1px,transparent 1px);
    background-size:40px 40px;pointer-events:none;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:40px 40px 48px;width:100%;max-width:420px;
    position:relative;z-index:1;animation:fadeUp 0.5s ease;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

  .profile-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:22px;}
  .profile-ring{width:96px;height:96px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),#3b82f6);
    padding:3px;margin-bottom:12px;
    box-shadow:0 0 20px rgba(0,212,170,0.25);}
  .profile-img{width:100%;height:100%;border-radius:50%;object-fit:cover;
    object-position:top center;border:2px solid var(--bg);}
  .profile-name{font-size:15px;font-weight:600;color:var(--text);margin-bottom:2px;}
  .profile-role{font-size:12px;color:var(--accent);font-family:var(--mono);}

  .badge{display:inline-flex;align-items:center;gap:6px;
    background:rgba(0,212,170,0.1);border:1px solid rgba(0,212,170,0.2);
    color:var(--accent);font-family:var(--mono);font-size:11px;
    padding:4px 12px;border-radius:20px;margin-bottom:16px;}
  .badge::before{content:'';width:6px;height:6px;background:var(--accent);
    border-radius:50%;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  h1{font-size:24px;font-weight:600;color:var(--text);margin-bottom:4px;text-align:center;}
  .subtitle{color:var(--muted);font-size:14px;margin-bottom:28px;text-align:center;}
  .field{margin-bottom:18px;}
  label{display:block;font-size:12px;font-family:var(--mono);color:var(--muted);
    text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;}
  input{width:100%;background:var(--bg);border:1px solid var(--border);
    border-radius:8px;padding:12px 16px;color:var(--text);
    font-family:var(--sans);font-size:15px;outline:none;transition:border-color 0.2s;}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,212,170,0.1);}
  input::placeholder{color:var(--muted);}
  .btn{width:100%;background:var(--accent);color:#0a0e1a;border:none;
    border-radius:8px;padding:14px;font-family:var(--sans);font-size:15px;
    font-weight:700;cursor:pointer;margin-top:8px;transition:all 0.2s;}
  .btn:hover{background:#00f0c0;transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .alert{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);
    color:var(--error);padding:12px 16px;border-radius:8px;
    font-size:13px;margin-bottom:18px;}
  .footer-link{text-align:center;margin-top:20px;font-size:14px;color:var(--muted);}
  .footer-link a{color:var(--accent);text-decoration:none;font-weight:500;}
  .footer-link a:hover{text-decoration:underline;}
  .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:12px;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
</style>
</head>
