
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps Exam Portal — Register</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0e1a;--surface:#111827;--border:#1e2d40;
    --accent:#00d4aa;--text:#e2e8f0;--muted:#64748b;
    --error:#f87171;--success:#34d399;
    --mono:'JetBrains Mono',monospace;--sans:'DM Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 70% 30%,rgba(59,130,246,0.07) 0%,transparent 50%),radial-gradient(ellipse at 30% 70%,rgba(0,212,170,0.07) 0%,transparent 50%);pointer-events:none;}
  .grid-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,170,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,170,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:48px 40px;width:100%;max-width:420px;position:relative;z-index:1;animation:fadeUp 0.5s ease;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.2);color:#60a5fa;font-family:var(--mono);font-size:11px;padding:4px 12px;border-radius:20px;margin-bottom:20px;}
  .badge::before{content:'';width:6px;height:6px;background:#60a5fa;border-radius:50%;}
  h1{font-size:26px;font-weight:600;color:var(--text);margin-bottom:6px;letter-spacing:-0.5px;}
  .subtitle{color:var(--muted);font-size:14px;margin-bottom:32px;}
  .field{margin-bottom:18px;}
  label{display:block;font-size:12px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;}
  input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 16px;color:var(--text);font-family:var(--sans);font-size:15px;outline:none;transition:border-color 0.2s;}
  input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(59,130,246,0.1);}
  input::placeholder{color:var(--muted);}
  .btn{width:100%;background:#3b82f6;color:#fff;border:none;border-radius:8px;padding:14px;font-family:var(--sans);font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;transition:all 0.2s;}
  .btn:hover{background:#60a5fa;transform:translateY(-1px);}
  .alert-error{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);color:var(--error);padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:18px;}
  .alert-success{background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.3);color:var(--success);padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:18px;}
  .footer-link{text-align:center;margin-top:24px;font-size:14px;color:var(--muted);}
  .footer-link a{color:#60a5fa;text-decoration:none;font-weight:500;}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="card">
  <div class="badge">New Account</div>
  <h1>Create account</h1>
  <p class="subtitle">Register to take the DevOps certification exam</p>

  {% if error %}<div class="alert-error">{{ error }}</div>{% endif %}
  {% if success %}<div class="alert-success">{{ success }} <a href="/login" style="color:var(--success);font-weight:600;">Login now &rarr;</a></div>{% endif %}

  <form method="POST">
    <div class="field">
      <label>Full Name</label>
      <input type="text" name="username" placeholder="Your name" required>
    </div>
    <div class="field">
      <label>Email address</label>
      <input type="email" name="email" placeholder="you@example.com" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" placeholder="Choose a password" required>
    </div>
    <button type="submit" class="btn">Create Account &rarr;</button>
  </form>
  <div class="footer-link">Already have an account? <a href="/login">Sign in</a></div>
</div>
</body>
</html>
